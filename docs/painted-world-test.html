function rayRect(ax,ay,bx,by,q){let dx=bx-ax,dy=by-ay,low=0,high=1;const pp=[-dx,dx,-dy,dy],qq=[ax-q.x,q.x+q.w-ax,ay-q.y,q.y+q.h-ay];for(let i=0;i<4;i++){if(Math.abs(pp[i])<.000001){if(qq[i]<0)return null;}else{const t=qq[i]/pp[i];if(pp[i]<0)low=Math.max(low,t);else high=Math.min(high,t);if(low>high)return null;}}return low;}
function firstObstacle(ax,ay,bx,by){let hit=null;function probe(r,kind){const t=rayRect(ax,ay,bx,by,r);if(t!==null&&(!hit||t<hit.t))hit={t,kind,x:lerp(ax,bx,t),y:lerp(ay,by,t)};}
 for(const w of S.walls)if(!w.open)probe(w,'wall');for(const p of platforms)probe({x:p.x,y:p.y,w:p.w,h:VIEW_H-p.y},'tissue');for(const q of lofts)probe({x:q.x,y:q.y,w:q.w,h:16},'loft');return hit;}
function inReach(x,y){const p=S.p;return Math.hypot(x-p.x,y-p.y)<355;}
function shoot(wx,wy){if(S.phase!=='play'||S.shotCd>0)return false;const p=S.p;if(!inReach(wx,wy)){say('ПОСТРІЛ ЗАНАДТО ДАЛЕКО. РУХАЙСЯ ВПЕРЕД, БУДУЙ ПЛАТФОРМИ!',1.6);return false;}
 if(S.bio<.999){say('ЦИТОПЛАЗМИ НЕМАЄ! ДОЧЕКАЙСЯ ПОВЕРНЕННЯ ЖЕЛЕ АБО ЗБЕРИ БІОКАПСУЛУ.',2);return false;}
 const ox=p.x+p.dir*18,oy=p.y-4,dist=Math.hypot(wx-ox,wy-oy);p.dir=wx>=p.x?1:-1;
 S.bio=Math.max(0,S.bio-1);p.visualShot=1;p.visualRecoil=1;S.shotCd=.18;S.stats.shots++;S.shots.push({x:ox,y:oy,ox,oy,tx:wx,ty:wy,dur:clamp(dist/1900,.12,.28),t:0,trail:[],dead:false});

function detonate(pad,fromHit=false){if(!pad||pad.dead)return false;pad.dead=true;const rel=S.objects.find(o=>o.id===pad.ref?.id);if(rel){rel.capturedBy=null;rel.vx=pad.ref.oldVx||70;}S.stats.blasts++;S.p.visualImpact=Math.max(S.p.visualImpact,.65);triggerCombos(pad.x,pad.y);makeShards(pad.x,pad.y,pad.kind,pad.kind==='virus'?18:12);ring(pad.x,pad.y,pad.kind==='virus'?290:190,pad.kind==='fire'?'#ffad72':C.pink);particles(pad.x,pad.y,pad.kind==='virus'?42:32,pad.kind==='fire'?'#ffbb70':C.pink,420);refund(pad,.8);S.screenShake=11;S.flash=.25;sound('blast');
 const rad=pad.kind==='virus'?230:pad.kind==='fire'?200:155;const p=S.p;let pd=Math.hypot(p.x-pad.x,p.y-pad.y);if(pd<rad){let nx=(p.x-pad.x)/(pd||1),ny=(p.y-pad.y)/(pd||1);p.vx+=nx*(rad-pd)*1.9;p.vy=Math.min(p.vy,-360-((rad-pd)/rad)*350);}
 for(const e of S.enemies){if(e.alive&&Math.hypot(e.x-pad.x,e.y-pad.y)<rad)damageEnemy(e,1,(e.x>=pad.x?1:-1)*170);}

function keyName(k){if(typeof k==='object'){if(k.code==='KeyW')return 'w';if(k.code==='KeyA')return 'a';if(k.code==='KeyD')return 'd';if(k.code==='KeyR')return 'r';if(k.code==='KeyN')return 'n';return (k.key||'').toLowerCase();}return String(k).toLowerCase();}
function keyDown(k){const s=keyName(k);if(s==='n'){start();return;}if(S.keys[s])return;S.keys[s]=true;

 S.elapsed+=dt;S.comboTime=Math.max(0,S.comboTime-dt);for(const c of S.cells)if(c.chargeFx>0)c.chargeFx=Math.max(0,c.chargeFx-dt);S.boost=Math.max(0,S.boost-dt);S.maxBio=S.boost>0?8:5;S.bio=clamp(S.bio+dt*.025,0,S.maxBio);S.p.invuln=Math.max(0,S.p.invuln-dt);S.p.bounceCd=Math.max(0,S.p.bounceCd-dt);

 const p=S.p,oldY=p.y,oldVy=p.vy,wasGrounded=p.grounded,move=(S.keys.a?-1:0)+(S.keys.d?1:0),speed= S.boost>0?312:282;

 for(const loft of lofts){if(p.grounded&&p.x>loft.x&&p.x<loft.x+loft.w&&Math.abs((p.y+p.r)-loft.y)<10&&!S.loftsVisited[loft.x]){S.loftsVisited[loft.x]=true;S.stats.alternateRoutes++;particles(p.x,p.y,14,C.aqua,150);say('ЗНАЙДЕНО ВЕРХНІЙ ШЛЯХ! МЕНШЕ НЕБЕЗПЕКИ, БОНУСНА БІОМАСА.',2.4);}}
 for(const gust of gusts){if(p.x>=gust.x&&p.x<gust.x+gust.w&&p.y>gust.y-110&&p.y<gust.y+gust.h&&p.vy!==0){p.vy-=Math.max(0,Math.sin(S.t*3.8+gust.x)) * 390*dt;}}
 for(const wall of S.walls){if(!wall.open&&p.y+p.r>wall.y&&p.y-p.r<wall.y+wall.h){if(p.x+p.r>wall.x&&p.x<wall.x+wall.w/2){p.x=wall.x-p.r;p.vx=0;}else if(p.x-p.r<wall.x+wall.w&&p.x>=wall.x+wall.w/2){p.x=wall.x+wall.w+p.r;p.vx=0;}}}
 // Jelly is a small trampoline; it is also a one/two-hit membrane shield.
 if(p.vy>=0&&p.bounceCd<=0){for(const gel of S.pads){if(gel.dead)continue;let rTop=gel.y-gel.ry*.89;if(Math.abs(p.x-gel.x)<gel.rx*.88&&oldY+p.r<=rTop+14&&p.y+p.r>=rTop){p.y=rTop-p.r;p.vy=gel.kind==='virus'?-990:gel.kind==='organelle'?-805:S.keys.w?-790:-670;p.grounded=false;p.bounceCd=.21;p.combo++;gel.pulse=2;gel.visualCompression=1;gel.visualShock=1;p.visualImpact=.92;sound('bounce');particles(p.x,p.y+p.r,10,C.pink,155);break;}}}
 if(p.y>776)respawn();
 // Dynamic objects drift, unless coated in gel.
 for(const o of S.objects){if(!o.alive||o.capturedBy)continue;o.x+=o.vx*dt;if(o.x<o.lo||o.x>o.hi)o.vx*=-1;o.y=o.originY+Math.sin(S.t*2.1+o.phase)*19;}
 // Bacteria can fire independently. Viruses are roaming hazards, never frozen.

 if(e.type==='virus'){

 }else{

   let dx=p.x-e.x,dy=p.y-e.y;if(Math.abs(dx)<500){let a=Math.atan2(dy,dx),spread=e.attack==='burst'?[-.16,0,.16]:[0];
    for(const offset of spread){const v=e.attack==='burst'?252:282;S.bullets.push({x:e.x,y:e.y-8,vx:Math.cos(a+offset)*v,vy:Math.sin(a+offset)*v,r:e.attack==='burst'?7:8,life:2.7,dead:false});}
    ring(e.x,e.y,e.attack==='burst'?48:28,C.red);particles(e.x,e.y,8,C.red,135);}}
  if(Math.hypot(p.x-e.x,p.y-e.y)<27+p.r&&p.invuln<=0)hurt();
 }}
 // Friendly projectiles visibly travel from the character to the click.
 for(const b of S.shots){if(b.dead)continue;const ox=b.x,oy=b.y;b.t=Math.min(1,b.t+dt/b.dur);const a=b.t*b.t*(3-2*b.t);let nx=lerp(b.ox,b.tx,a),ny=lerp(b.oy,b.ty,a)-Math.sin(b.t*PI)*14;
 const obstruction=firstObstacle(ox,oy,nx,ny);if(obstruction){nx=obstruction.x;ny=obstruction.y;}b.x=nx;b.y=ny;b.trail.push([nx,ny]);if(b.trail.length>10)b.trail.shift();
 if(obstruction||b.t>=1){b.dead=true;spawnGel(b.x,b.y);}}
 S.shots=S.shots.filter(b=>!b.dead);
 for(const b of S.bullets){if(b.dead)continue;const bx=b.x,by=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<0){b.dead=true;continue;}
 const wallImpact=firstObstacle(bx,by,b.x,b.y);if(wallImpact){b.dead=true;particles(wallImpact.x,wallImpact.y,6,C.red,60);continue;}
 let blocked=false;for(const g of S.pads)if(!g.dead&&sqr((b.x-g.x)/(g.rx+6))+sqr((b.y-g.y)/(g.ry+6))<1){b.dead=true;g.hp--;S.stats.blocks++;particles(b.x,b.y,15,C.blue,130);ring(b.x,b.y,37,C.blue);sound('gel');if(g.hp<=0)pop(g,'shield');blocked=true;break;}
 if(!blocked&&Math.hypot(b.x-p.x,b.y-p.y)<p.r+b.r){b.dead=true;hurt();}}
 S.bullets=S.bullets.filter(b=>!b.dead&&Math.abs(b.x-p.x)<900);
 // Kinetic shrapnel is real: shards ricochet, damage enemies, and can start nearby jelly reactions.
 for(const sh of S.shards){if(sh.dead)continue;sh.px=sh.x;sh.py=sh.y;sh.life-=dt;sh.vy+=440*dt;sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;

    if(sh.life<=0)sh.dead=true;}
  for(const e of S.enemies){if(!e.alive)continue;const rr=e.type==='virus'?32+e.inflated*14:28;

    particles(sh.x,sh.y,8,C.yellow,135);break;}}
  if(!sh.dead){for(const g of S.pads){if(!g.dead&&g.kind==='basic'&&Math.hypot(sh.x-g.x,sh.y-g.y)<Math.min(g.rx,g.ry)*.67){g.chainIn=Math.min(g.chainIn??99,.12);sh.dead=true;break;}}}
 }

function txt(s,x,y,sz=16,color=C.pale,align='left',weight='600'){ctx.fillStyle=color;ctx.font=weight+' '+sz+'px system-ui,Arial,sans-serif';ctx.textAlign=align;ctx.fillText(s,x,y);ctx.textAlign='left';}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function circ(x,y,r,color,stroke=null,lw=1){ctx.beginPath();ctx.arc(x,y,Math.max(.2,r),0,TAU);ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function ellipse(x,y,rx,ry,color,stroke=null,lw=1){ctx.beginPath();ctx.ellipse(x,y,Math.max(.2,rx),Math.max(.2,ry),0,0,TAU);ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function line(x,y,x2,y2,col,w=2){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();}
function rr(x,y,w,h,r,fill,stroke=null,sw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.stroke();}}

function artOpacity(){return clamp((1550-S.cam)/510,0,1);}
function artGlow(x,y,r,rgb,a=1){
 const g=ctx.createRadialGradient(x,y,2,x,y,r);
 g.addColorStop(0,`rgba(${rgb},${.23*a})`);g.addColorStop(.45,`rgba(${rgb},${.065*a})`);g.addColorStop(1,`rgba(${rgb},0)`);
 ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
}
function artSeed(i){return (Math.sin(i*78.233+12.7)*43758.5453)%1;}

 ctx.bezierCurveTo(-35,-36,-100,-91,-235,-57);ctx.closePath();

function artCell(x,y,rx,ry,seed,kind='indigo'){
 ctx.save();ctx.translate(x,y);ctx.rotate(.08*Math.sin(seed*4)+.03*Math.sin(S.t*.35+seed));
 const t=S.t*.18+seed;let k=1+.025*Math.sin(S.t*.77+seed);ctx.scale(k,k);
 const base=kind==='teal'?['#142f40','#315568','#82c9bb']:kind==='rose'?['#352039','#563451','#ac7aab']:['#161e38','#313252','#70628b'];
 // Soft translucent glow, edged by tissue membrane (unlit body remains dark).
 artGlow(0,0,Math.max(rx,ry)*1.35,kind==='teal'?'47,152,157':'139,82,170',.57);
 function shape(f=1){ctx.beginPath();for(let i=0;i<=48;i++){
  const a=i/48*TAU,v=1+.053*Math.sin(5*a+seed*3)+.042*Math.sin(7*a-seed*4+S.t*.25);
  const px=Math.cos(a)*rx*f*v,py=Math.sin(a)*ry*f*v;
  i?ctx.lineTo(px,py):ctx.moveTo(px,py);
 }ctx.closePath();}
 shape(1);const g=ctx.createRadialGradient(-rx*.24,-ry*.38,8,0,0,Math.max(rx,ry)*1.22);
 g.addColorStop(0,base[1]);g.addColorStop(.72,base[0]);g.addColorStop(1,'#10192d');ctx.fillStyle=g;ctx.globalAlpha=.52;ctx.fill();ctx.globalAlpha=1;
 ctx.strokeStyle=base[2];ctx.globalAlpha=.37;ctx.lineWidth=3;ctx.stroke();ctx.globalAlpha=1;
 shape(.85);ctx.strokeStyle='rgba(178,201,215,.085)';ctx.lineWidth=2;ctx.stroke();
 const ng=ctx.createRadialGradient(-rx*.09,-ry*.12,2,0,0,Math.min(rx,ry)*.52);
 ng.addColorStop(0,kind==='rose'?'rgba(223,125,197,.26)':'rgba(119,224,214,.20)');ng.addColorStop(1,'rgba(37,55,71,0)');
 ctx.fillStyle=ng;ctx.beginPath();ctx.ellipse(0,0,rx*.48,ry*.45,.3,0,TAU);ctx.fill();
 ctx.strokeStyle='rgba(169,205,222,.16)';ctx.lineWidth=1.5;
 for(let i=0;i<6;i++){const a=i*TAU/6+t*.23;ctx.beginPath();ctx.arc(Math.cos(a)*rx*.39,Math.sin(a)*ry*.37,3+i%3,0,TAU);ctx.stroke();}
 ctx.restore();
}
function artVein(x,y,len,angle,color='rgba(72,185,171,.22)',weight=8,seed=0){
 ctx.save();ctx.translate(x,y);ctx.rotate(angle);const wig=Math.sin(S.t*.8+seed)*5;
 ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(22,-len*.22,wig-20,-len*.67,10+wig,-len);
 ctx.lineCap='round';ctx.strokeStyle=color;ctx.lineWidth=weight;ctx.stroke();
 ctx.strokeStyle='rgba(151,247,222,.19)';ctx.lineWidth=Math.max(1,weight*.17);ctx.stroke();
 // Fine capillaries branch from a major vessel.
 for(let i=1;i<=3;i++){const yy=-len*i/4,side=i%2?1:-1;

function isPaintedReady(im){return !!(im && im.complete && im.naturalWidth>0);}
function paintBlend(){return clamp((1480-S.cam)/430,0,1);}
function paintLayer(im,x,y,w,h,a=1){if(!isPaintedReady(im))return;ctx.save();ctx.globalAlpha*=a;ctx.drawImage(im,x,y,w,h);ctx.restore();}
function drawPaintedBackdrop(){
 const a=paintBlend();if(a<.001)return;
 ctx.save();ctx.globalAlpha=a;
 // Flat far plane stays behind everything. Slight offset creates true 0.12× parallax.
 paintLayer(painted_far,-145-S.cam*.12,-33,1615,799,.99);
 // Two transparent paint layers have independent camera offsets and slow organic drift.
 const t=S.t;
 paintLayer(painted_vessels,-85-S.cam*.35,73+3*Math.sin(t*.48),1860,820,.86);
 paintLayer(painted_organelles,-65-S.cam*.64,30+4*Math.sin(t*.7),1670,746,.86);
 ctx.restore();
}
function drawPaintedPlatforms(){
 const a=paintBlend();if(a<.001)return;
 ctx.save();ctx.globalAlpha=a;
 // Grounded sprites are aligned to the immutable gameplay platform collision tops.
 const l=platforms[0],r=platforms[1],q=lofts[0];
 paintLayer(painted_platformLeft,l.x-5,l.y-15,l.w+10,210,1);
 paintLayer(painted_platformRight,r.x-5,r.y-15,r.w+10,180,1);
 paintLayer(painted_loft,q.x-5,q.y-14,q.w+10,100,.94);
 ctx.restore();
}
function drawPaintedForeground(){
 const a=paintBlend();if(a<.001)return;
 ctx.save();ctx.globalAlpha=a;
 // 1.13× moves faster than gameplay. Transparent edges, never blocks player center.
 paintLayer(painted_foreground,-145-S.cam*1.13,20,1610,830,.85);
 ctx.restore();
}

function drawArtBackdrop(){const fade=artOpacity();if(fade<=0)return;
 ctx.save();ctx.globalAlpha=fade;
 let bg=ctx.createLinearGradient(0,0,460,720);bg.addColorStop(0,'#080d1e');bg.addColorStop(.45,'#101b2c');bg.addColorStop(1,'#101225');ctx.fillStyle=bg;ctx.fillRect(0,0,VIEW_W,VIEW_H);
 if(artFar&&artFar.complete&&artFar.naturalWidth>0){ctx.save();ctx.globalAlpha=.90;ctx.drawImage(artFar,-90-S.cam*.12,12,1440,715);ctx.restore();}
 // Deep diffuse light pool: a visual focal point behind the first jump and membrane shelf.
 artGlow(798-S.cam*.12,302,500,'23,166,157',.77);
 artGlow(1190-S.cam*.12,515,440,'122,60,132',.66);
 artGlow(165-S.cam*.12,274,345,'71,69,142',.48);
 // FAR — giant living cells; low-contrast, huge scale establishes anatomy.
 ctx.save();ctx.translate(-S.cam*.12,0);
 artCell(37,251,285,236,1.1,'indigo');artCell(468,83,225,192,2.1,'rose');
 artCell(886,243,255,203,4.2,'teal');artCell(1225,534,248,199,5.1,'indigo');
 artCell(1499,72,239,178,1.6,'rose');
 // Semi-translucent ribbed tissue structures, terminating behind the traversable gap.
 artRibbon(446,265,.93,1.4);artRibbon(1190,250,.77,3.7);
 ctx.restore();
 // MID — branching capillary arches, curved vessels and dim luminal membranes.
 ctx.save();ctx.translate(-S.cam*.35,0);
 for(const [x,y,sc,ph] of [[110,-20,.95,1],[690,40,.65,2],[1370,42,.84,3]]){
  artRibbon(x,y,sc,ph);
 }
 for(let i=0;i<11;i++){const x=i*164-170+(i%3)*38,y=175+(i*137)%320;
  artVein(x,y,115+(i%4)*47,.18*Math.sin(i*3),i%3===0?'rgba(131,87,145,.20)':'rgba(68,149,152,.16)',6+i%3*3,i);
 }
 // Organelles orbit softly in the distance, like suspended ink in liquid.
 for(let i=0;i<23;i++){
  const x=70+(i*173)%1620, y=113+(i*97)%430;
  const r=8+(i%4)*5,dx=Math.sin(S.t*.26+i*1.7)*5,dy=Math.cos(S.t*.37+i*2.3)*6;
  ctx.save();ctx.translate(x+dx,y+dy);ctx.rotate(i+S.t*.09);
  ctx.beginPath();ctx.ellipse(0,0,r*1.4,r*.8,.3,0,TAU);
  ctx.fillStyle=i%3===0?'rgba(114,204,191,.095)':'rgba(163,117,186,.11)';ctx.fill();
  ctx.strokeStyle='rgba(150,222,220,.15)';ctx.lineWidth=1.1;ctx.stroke();ctx.restore();
 }
 ctx.restore();
 // NEAR — silk-thin hanging cilia; intentionally low-contrast in the gameplay corridor.
 ctx.save();ctx.translate(-S.cam*.63,0);
 for(let i=0;i<43;i++){
  let x=i*49-160+((i%5)*11),height=55+(i*37)%118;
  ctx.beginPath();ctx.moveTo(x,-12);ctx.bezierCurveTo(x-12,-5+height*.4,x+20+Math.sin(S.t*.7+i)*9,height*.7,x+Math.sin(S.t*.7+i)*12,height);
  ctx.strokeStyle=i%6===0?'rgba(142,113,173,.14)':'rgba(102,193,183,.11)';ctx.lineWidth=i%6===0?4:1.8;ctx.stroke();
  if(i%5===0)artGlow(x,height,11,'119,222,203',.24);
 }
 // Soft scattered plankton gives depth, but avoids UI and the main traversal edges.
 for(let i=0;i<95;i++){
  const x=((i*137+37)%1800),y=118+(i*199)%450;
  const flick=.55+.45*Math.sin(S.t*(.7+i%3*.2)+i);
  ctx.beginPath();ctx.arc(x+Math.sin(S.t*.2+i)*5,y,0.5+i%4*.42,0,TAU);
  ctx.fillStyle=i%3===0?`rgba(212,174,218,${flick*.27})`:`rgba(163,225,210,${flick*.23})`;ctx.fill();
 }
 ctx.restore();

(function(){const canvas=document.getElementById('game'),game=createCytoplasm(canvas);window.__cytoplasm=game;

})();
